<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f19" />
  <title>Rudra Kore | Connect</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 10%, rgba(91, 82, 255, .25), transparent 35%),
        radial-gradient(circle at 85% 85%, rgba(0, 210, 255, .16), transparent 35%),
        #080b12;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }
    .page { width: 100%; max-width: 520px; }
    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 28px;
      padding: 32px 22px 24px;
      background: rgba(17, 22, 34, .78);
      backdrop-filter: blur(18px);
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
    }
    .avatar {
      width: 92px; height: 92px; margin: 4px auto 18px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 32px; font-weight: 800;
      background: linear-gradient(135deg, #7c6cff, #2dd4ff);
      box-shadow: 0 0 40px rgba(91, 82, 255, .35);
    }
    h1 { text-align: center; font-size: 30px; letter-spacing: -.7px; }
    .tagline {
      text-align: center; color: #aeb7ca; margin-top: 7px; font-size: 15px;
    }
    .buttons { display: grid; gap: 13px; margin-top: 30px; }
    .btn {
      text-decoration: none; color: white; font-weight: 700;
      min-height: 58px; border-radius: 17px; padding: 0 18px;
      display: flex; align-items: center; gap: 14px;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.055);
      transition: transform .28s cubic-bezier(.22,1,.36,1), background .28s ease, border-color .28s ease, box-shadow .28s ease;
      will-change: transform;
    }
    .btn:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,.10);
      border-color: rgba(255,255,255,.18);
      box-shadow: 0 10px 28px rgba(0,0,0,.22);
    }
    .btn:active {
      transform: translateY(0) scale(.98);
      transition-duration: .12s;
    }
    .btn:focus-visible {
      outline: 2px solid rgba(255,255,255,.75);
      outline-offset: 3px;
    }
    .icon { transition: transform .28s cubic-bezier(.22,1,.36,1); }
    .btn:hover .icon { transform: scale(1.08) rotate(-3deg); }
    .icon {
      width: 38px; height: 38px; border-radius: 12px;
      display: grid; place-items: center; flex: 0 0 38px;
      background: rgba(255,255,255,.09); font-size: 20px;
    }
    .label { flex: 1; }
    .small { display:block; color:#929caf; font-size:12px; font-weight:500; margin-top:2px; }
    .arrow { color:#8791a6; font-size:20px; }
    .footer {
      text-align:center; color:#697387; font-size:12px; margin-top:22px;
    }
    .copy {
      border: 0; cursor:pointer; color:#aeb7ca; background:none;
      font-size:12px; margin-top:10px;
    }
    .toast {
      position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px);
      opacity: 0; pointer-events:none; background:#fff; color:#111;
      padding:10px 16px; border-radius:999px; font-size:13px; font-weight:700;
      transition:.2s;
    }
    .toast.show { opacity:1; transform:translate(-50%,0); }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="avatar">RK</div>
      <h1>Rudra Kore</h1>
      <p class="tagline">Let's connect</p>

      <div class="buttons">
        <a class="btn" href="tel:+918668432493">
          <span class="icon">📞</span>
          <span class="label">Call me<span class="small">8668432493</span></span>
          <span class="arrow">›</span>
        </a>

        <a class="btn" href="https://wa.me/918208828571" target="_blank" rel="noopener">
          <span class="icon">💬</span>
          <span class="label">WhatsApp<span class="small">8208828571</span></span>
          <span class="arrow">›</span>
        </a>

        <a class="btn" href="https://instagram.com/rudrakore21" target="_blank" rel="noopener">
          <span class="icon">📷</span>
          <span class="label">Instagram<span class="small">@rudrakore21</span></span>
          <span class="arrow">›</span>
        </a>

        <a class="btn" href="mailto:rudrakore349@gmail.com">
          <span class="icon">✉️</span>
          <span class="label">Email<span class="small">rudrakore349@gmail.com</span></span>
          <span class="arrow">›</span>
        </a>
      </div>

      <button class="copy" onclick="copyNumber()">Copy phone number</button>
      <p class="footer">© 2026 Rudra Kore</p>
    </section>
  </main>

  <div id="toast" class="toast">Phone number copied</div>

  <script>
    function copyNumber() {
      navigator.clipboard.writeText("8668432493").then(() => {
        const toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1800);
      });
    }
  </script>
</body>
</html>
